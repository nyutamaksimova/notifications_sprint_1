x-app: &app
  build: .
  env_file: ${NOTIFICATION_ENV_FILE:-.env}
  restart: unless-stopped
  depends_on:
    seed:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: notification
    volumes:
      - notification_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - notification_broker:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
  migrate:
    build: .
    env_file: ${NOTIFICATION_ENV_FILE:-.env}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  seed:
    build: .
    env_file: ${NOTIFICATION_ENV_FILE:-.env}
    command: ["python", "-m", "notification_service.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *app
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8003:8000"
  publisher:
    <<: *app
    command: ["python", "-m", "notification_service.workers.publisher"]
  prepare:
    <<: *app
    command: ["python", "-m", "notification_service.workers.prepare"]
  send:
    <<: *app
    command: ["python", "-m", "notification_service.workers.send"]
  urgent-publisher:
    <<: *app
    environment:
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.publisher"]
  urgent-prepare:
    <<: *app
    environment:
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.prepare"]
  urgent-send:
    <<: *app
    environment:
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.send"]

volumes:
  notification_db:
  notification_broker:
