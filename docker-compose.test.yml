# Dedicated test stack. Credentials below are intentionally public test fixtures.
x-notification-env: &notification-env
  DATABASE_URL: postgresql+asyncpg://notification:test@notification-postgres:5432/notification_test
  RABBITMQ_URL: amqp://test:test@rabbitmq:5672/
  AUTH_URL: http://auth-service:8000
  AUTH_READER_TOKEN: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
  SERVICE_TOKENS: '{"auth":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","catalog":"cccccccccccccccccccccccccccccccc","operator":"oooooooooooooooooooooooooooooooo"}'
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: cinema@example.org

x-auth-env: &auth-env
  ENV_FILE: /app/nonexistent.env
  DB_HOST: postgres
  DB_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: auth_db
  POSTGRES_ECHO: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: test-only-secret-not-for-production
  JWT_ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "10"
  REFRESH_TOKEN_EXPIRE_DAYS: "1"
  ADMIN_EMAIL: admin@example.org
  ADMIN_PASSWORD: test-admin-password
  YANDEX_CLIENT_ID: test
  YANDEX_CLIENT_SECRET: test
  YANDEX_REDIRECT_URI: http://localhost
  NOTIFICATION_URL: http://api:8000
  NOTIFICATION_API_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  NOTIFICATION_READER_TOKEN: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
  TZ: UTC

x-worker: &worker
  build: .
  environment: *notification-env
  depends_on:
    seed:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
    auth-service:
      condition: service_healthy

services:
  notification-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: test
      POSTGRES_DB: notification_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_test"]
      interval: 2s
      retries: 30
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 2s
      retries: 30
  redis:
    image: redis:7
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
  auth-service:
    build: ../sprint8/auth-service
    environment: *auth-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 3s
      retries: 40
  auth-publisher:
    build: ../sprint8/auth-service
    environment: *auth-env
    command: ["python", "-m", "src.workers.notification_publisher"]
    depends_on:
      auth-service:
        condition: service_healthy
      api:
        condition: service_healthy
  migrate:
    build: .
    environment: *notification-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      notification-postgres:
        condition: service_healthy
  seed:
    build: .
    environment: *notification-env
    command: ["python", "-m", "notification_service.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    <<: *worker
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 3s
      retries: 30
  publisher:
    <<: *worker
    command: ["python", "-m", "notification_service.workers.publisher"]
  prepare:
    <<: *worker
    command: ["python", "-m", "notification_service.workers.prepare"]
  send:
    <<: *worker
    command: ["python", "-m", "notification_service.workers.send"]
  urgent-publisher:
    <<: *worker
    environment:
      <<: *notification-env
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.publisher"]
  urgent-prepare:
    <<: *worker
    environment:
      <<: *notification-env
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.prepare"]
  urgent-send:
    <<: *worker
    environment:
      <<: *notification-env
      WORKER_LANE: urgent
    command: ["python", "-m", "notification_service.workers.send"]
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["tests"]
    environment:
      TEST_POSTGRES_URL: postgresql+asyncpg://notification:test@notification-postgres:5432/notification_test
      TEST_RABBITMQ_URL: amqp://test:test@rabbitmq:5672/
      E2E_NOTIFICATION_URL: http://api:8000
      E2E_AUTH_URL: http://auth-service:8000
      E2E_MAILPIT_URL: http://mailpit:8025
    depends_on:
      api:
        condition: service_healthy
      auth-service:
        condition: service_healthy
  auth-tests:
    build: ../sprint8/auth-service
    profiles: ["tests"]
    environment: *auth-env
    command: ["python", "-m", "pytest", "src/tests/functional", "-v"]
    depends_on:
      auth-service:
        condition: service_healthy
